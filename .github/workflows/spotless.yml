name: Spotless Checker 😎

on: [pull_request]

permissions:
  contents: read
  pull-requests: write

jobs:
  spotless:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources 📄
        uses: actions/checkout@v6

      - name: Setup Java ☕
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 24

      - name: Run Spotless Check 🧪
        run: ./backend/gradlew -p ./backend/ spotlessCheck

      - name: Javadoc check 📚
        run: ./backend/gradlew -p ./backend/ checkstyleMain
