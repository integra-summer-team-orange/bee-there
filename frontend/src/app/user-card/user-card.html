<div class="user-card">
  <h2>{{ user().name }}</h2>

  <p>{{ user().createdAt }}</p>
  <p>{{ user().email }}</p>
  <p>{{ user().phone }}</p>
  <p>{{ user().role }}</p>

  <div class="actions">
    <p-button label="Details"></p-button>
    <p-button label="Edit"></p-button>
    <p-button label="Delete"></p-button>
  </div>
</div>
