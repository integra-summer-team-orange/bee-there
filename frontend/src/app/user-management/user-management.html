<div class="top-page">
  <h1>User overview</h1>

  <div class="actions">
    <input pInputText class="search-input" placeholder="Search user" />

    <p-button label="Add user" icon="pi pi-plus" styleClass="add-user-button"></p-button>
  </div>
</div>

<div class="users-grid">
  @for (user of users; track user.id) {
    <app-user-card [user]="user"></app-user-card>
  }
</div>
