<button
  type="button"
  class="block h-full w-full text-left disabled:cursor-not-allowed"
  [attr.aria-pressed]="selected()"
  [disabled]="soldOut() && !selected()"
  (click)="choose.emit(item())"
>
  <p-card [styleClass]="cardClass()" [style]="cardStyle()">
    <ng-template #title>
      <span class="line-clamp-2 text-xl font-semibold">{{ item().name }}</span>

      <span class="mt-3 block h-1 w-full rounded-full bg-outline-variant">
        <span
          class="block h-full rounded-full transition-all"
          [style.width.%]="reservedShare() * 100"
          [style.backgroundColor]="levelColor()"
        ></span>
      </span>
    </ng-template>

    <ng-template #content>
      <p class="text-sm">
        <span class="font-semibold" i18n>Reserved:</span>
        {{ reserved() }}/{{ item().totalQuantity }}
      </p>
    </ng-template>
  </p-card>
</button>
