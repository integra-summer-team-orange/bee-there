<p-card [styleClass]="cardClass()" [style]="cardStyle()">
  <ng-template #title>
    <span class="line-clamp-2 text-xl font-semibold">{{ item().name }}</span>

    <span class="mt-3 block h-1 w-full rounded-full bg-outline-variant">
      <span
        class="block h-full rounded-full transition-all"
        [style.width.%]="reservedShare() * 100"
        [style.backgroundColor]="levelColor()"
      ></span>
    </span>
  </ng-template>

  <ng-template #content>
    <div class="flex flex-col items-center gap-4">
      <p class="w-full text-sm">
        <span class="font-semibold" i18n>Reserved:</span>
        {{ reserved() }}/{{ item().totalQuantity }}
      </p>

      <p-inputnumber
        size="small"
        [showButtons]="true"
        buttonLayout="horizontal"
        incrementButtonIcon="pi pi-plus"
        decrementButtonIcon="pi pi-minus"
        inputStyleClass="w-12 text-center"
        [min]="0"
        [max]="item().availableQuantity"
        [ariaLabel]="'Quantity of ' + item().name"
        [ngModel]="quantity()"
        (ngModelChange)="onQuantityChange($event)"
      />
    </div>
  </ng-template>
</p-card>
