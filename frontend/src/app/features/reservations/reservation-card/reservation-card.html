<button
  type="button"
  class="flex w-full flex-col gap-3 rounded-lg border p-4 text-left shadow-sm wrap-anywhere transition-colors hover:bg-surface-container-low"
  [class.border-outline-variant]="!selected()"
  [class.border-general-highlight]="selected()"
  [class.bg-surface-container-low]="selected()"
  [attr.aria-pressed]="selected()"
  (click)="choose.emit(booking())"
>
  <span class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
    <span class="line-clamp-2 min-w-0 font-semibold">{{ booking().resourceName }}</span>
    <span class="shrink-0 text-sm text-on-surface-variant">
      {{ booking().start | date: 'd MMM y, HH:mm' }} &ndash; {{ booking().end | date: 'HH:mm' }}
    </span>
  </span>

  <span class="flex items-center gap-3 text-sm">
    <span class="text-on-surface-variant" i18n>Participants:</span>
    <app-participant-stack [people]="everyone()" />
  </span>
</button>
