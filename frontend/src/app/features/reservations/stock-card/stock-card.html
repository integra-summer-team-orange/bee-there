<p-card styleClass="h-full wrap-anywhere border border-outline-variant shadow-md" [style]="cardStyle()">
  <ng-template #title>
    <span class="line-clamp-2 text-xl font-semibold">{{ item().name }}</span>
  </ng-template>

  <ng-template #content>
    <div class="flex flex-col gap-2 text-sm">
      <div class="h-1 w-full bg-surface-container-high" aria-hidden="true">
        <div class="h-1" [style.width.%]="share()" [style.background]="barColour()"></div>
      </div>
      <p>
        <span class="font-semibold" i18n>Reserved:</span> {{ reserved() }}/{{ item().totalQuantity }}
      </p>

      <p-inputnumber
        class="mx-auto mt-2"
        inputStyleClass="w-12 text-center"
        [showButtons]="true"
        buttonLayout="horizontal"
        incrementButtonIcon="pi pi-plus"
        decrementButtonIcon="pi pi-minus"
        [min]="0"
        [max]="max()"
        [ngModel]="quantity()"
        (ngModelChange)="quantityChange.emit($event ?? 0)"
        [ariaLabel]="'Quantity of ' + item().name"
      />
    </div>
  </ng-template>
</p-card>
