<main>
  <!--Breadcrumb Bar-->
  <!-- p-breadcrumb renders every crumb at the same size, so the trail is built by hand. -->
  <nav class="mb-8 flex items-center gap-2">
    <a
      routerLink="/venues"
      aria-label="Back to venues"
      class="pi pi-chevron-left text-sm text-on-surface-variant hover:text-on-surface"
    ></a>
    <a routerLink="/venues" class="text-lg text-on-surface-variant hover:text-on-surface">Venues</a>
    <span class="text-lg text-outline">/</span>
    <a routerLink="/venues/{{ venueId() }}" class="text-lg text-on-surface-variant hover:text-on-surface">{{ venueName() }}</a>
    <span class="text-lg text-outline">/</span>
    <span class="min-w-0 truncate text-2xl font-bold text-general-highlight">
      Inventory
    </span>
  </nav>

  <div class="toolbar flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ venueName() }} Inventory</h1>
    <div class="actions flex items-center gap-3">
      <p-iconfield iconPosition="right" class="custom-search">
        <p-inputicon class="pi pi-search" />
        <input
          type="text"
          pInputText
          placeholder="Search inventory..."
          [ngModel]="searchQuery()"
          (ngModelChange)="searchQuery.set($event); first.set(0);" />
      </p-iconfield>

      <p-button label="+ Add item" class="purple-btn" (onClick)="openCreate()" />
    </div>
  </div>

  <!-- Dynamic Grid Loop -->
  <section class="cards-grid relative min-h-[200px]">
    <p-toast />
    @if (loading()) {
      <div class="absolute inset-0 flex justify-center items-center z-10 bg-surface/50">
        <p-progressSpinner ariaLabel="loading" />
      </div>
    }

    @for (item of paginatedItems(); track item.id) {
      <inventory-card
        [item]="item"
        (delete)="openDelete($event)"
        (edit)="openEdit($event)" />
    }
  </section>

  <inventory-overlays
    [(visible)]="overlayVisible"
    [mode]="overlayMode()"
    [(item)]="selectedItem"
    (confirm)="handleConfirm($event)"
    (delete)="deleteItem($event)" />

  <!-- Paginator -->
  <p-paginator
    (onPageChange)="onPageChange($event)"
    [first]="first()"
    [rows]="rows()"
    [totalRecords]="filteredItems().length"
    [showFirstLastIcon]="false"
    [showPageLinks]="true"
    [pageLinkSize]="3" />

</main>
