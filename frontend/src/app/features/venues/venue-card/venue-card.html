<p-card styleClass="h-full border border-outline-variant shadow-md">
  <ng-template #title>
    <span class="text-xl font-semibold">{{ venue().name }}</span>
  </ng-template>

  <ng-template #content>
    <div class="flex flex-col gap-2 text-sm">
      <p><span class="font-semibold" i18n>Managed by</span> {{ venue().managedByName }}</p>
      <p>
        <span class="font-semibold" i18n>Added</span> {{ venue().createdAt | date: 'd MMMM, y' }}
      </p>

      @if (venue().description) {
        <p class="text-on-surface-variant">{{ venue().description }}</p>
      }

      <p class="flex items-start gap-2 text-on-surface-variant">
        <i class="pi pi-map-marker mt-0.5" aria-hidden="true"></i>
        <span>{{ venue().address }}</span>
      </p>
    </div>
  </ng-template>

  <ng-template #footer>
    <div class="flex flex-wrap items-center gap-2">
      <p-button label="Details" size="small" [routerLink]="['/venues', venue().id]" />

      @if (manageable()) {
        <p-button
          icon="pi pi-pencil"
          size="small"
          [outlined]="true"
          ariaLabel="Edit venue"
          [routerLink]="['/venues', venue().id, 'edit']"
        />
        <p-button
          label="Delete"
          size="small"
          severity="danger"
          [outlined]="true"
          (onClick)="remove.emit(venue())"
        />
      }
    </div>
  </ng-template>
</p-card>
