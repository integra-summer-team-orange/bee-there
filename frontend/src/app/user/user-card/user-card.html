<div class="flex items-center justify-between rounded-lg border border-outline-variant p-6">

  <div class="min-w-0 flex-1 flex flex-col gap-1">
    <h3 class="m-0 truncate font-semibold text-on-surface">
      {{ user().name }}
    </h3>

    <p class="m-0 truncate text-on-surface-variant">
      {{ user().email }}
    </p>

    <p class="m-0 truncate text-on-surface-variant">
      {{ user().phone }}
    </p>

    <p class="m-0 truncate text-on-surface-variant">
      {{ user().role }}
    </p>
  </div>

  <div class="ml-4 flex shrink-0 gap-3">

    <p-button
      label="Details"
      size="small"
      (onClick)="onDetails()">
    </p-button>

    <p-button
      label="Edit"
      size="small"
      [outlined]="true"
      (onClick)="onEdit()">
    </p-button>

    <p-button
      label="Delete"
      size="small"
      severity="danger"
      [outlined]="true"
      (onClick)="onDelete()">
    </p-button>

  </div>

</div>
