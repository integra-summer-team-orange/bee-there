<div class="top-page">

  <h1>User overview</h1>

  <div class="actions">

    <input
      pInputText
      class="search-input"
      placeholder="Search user"
    />

    <p-button
      label="Add user"
      icon="pi pi-plus"
      class="add-user-button"
      (onClick)="openAddUser()">
    </p-button>

  </div>

</div>

<div class="users">

  @for (user of users; track user.id) {
    <app-user-card
      [user]="user"
      (edit)="openEditUser($event)"
      (details)="openDetails($event)"
      (delete)="deleteUser($event)">
    </app-user-card>
  }

</div>

<app-user-dialog
  [visible]="showUserDialog"
  [mode]="dialogMode"
  [user]="selectedUser"
  (closed)="closeDialog()"
  (saved)="onUserSaved()">
</app-user-dialog>

<p-confirm-dialog></p-confirm-dialog>
