import org.openapitools.generator.gradle.plugin.tasks.GenerateTask

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.8.0'
    id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
    id 'org.openapi.generator' version '7.16.0'
    id 'checkstyle'
}

group = 'cloudflight.integra'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // SpringBoot Web
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // openAPI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    //bcrypt
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Development-only
    developmentOnly 'org.springframework.boot:spring-boot-devtools'


    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform {
        if (project.hasProperty('excludeTags')) {
            excludeTags project.property('excludeTags').split(',')
        }
    }
}

spotless {
    java {
        palantirJavaFormat()
    }
}

openApi {
    apiDocsUrl.set("http://localhost:8080/v3/api-docs")
    outputDir.set(layout.buildDirectory.dir("openapi").get().asFile)
    outputFileName.set("openapi.json")

    waitTimeInSeconds.set(10)

    waitTimeInSeconds.set(20)

    customBootRun {
        args = ["--spring.profiles.active=openapi"]
    }
}

tasks.register('generateAngularClient', GenerateTask) {
    dependsOn tasks.generateOpenApiDocs
    generatorName.set("typescript-angular")
    inputSpec.set(layout.buildDirectory.file("openapi/openapi.json").get().asFile.toURI().toString())


    outputDir.set(file("${projectDir}/../frontend/src/api/generated").absolutePath)
    apiPackage.set("api")
    modelPackage.set("models")

    configOptions.set([
        npmName    : "api-client",
        supportsES6: "true"
    ])
}

tasks.build {
    dependsOn tasks.generateAngularClient
}

checkstyle {
    toolVersion = '10.26.1'
    configFile = file("../config/checkstyle/checkstyle.xml")
}

tasks.named("checkstyleMain", Checkstyle) {
    include("**/*Controller.java")
    include("**/*Service.java")
    include("**/*Repository.java")
    include("**/*Mapper.java")
}

tasks.named("checkstyleTest") {
    enabled = false //only needed for javadoc testing, enable it when needed
}
