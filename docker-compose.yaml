services:
  db:
    image: postgres:16-alpine
    container_name: bee-there-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bee-there
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d bee-there" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
    name: bee-there-db-data
